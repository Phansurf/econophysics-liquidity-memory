[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "econophysics-liquidity-memory"
version = "1.0.0"
description = "Reproducible polynomial Langevin inference, stochastic liquidity and multi-scale volatility-memory experiments"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "scipy>=1.10,<2", "matplotlib>=3.7,<4", "pandas>=2.0,<3"]

[project.scripts]
frontier-econophysics = "frontier_econophysics.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
